<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión - IMAGEN</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b0d;
            color: #f4f5f7;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            padding: 24px;
            text-align: center;
        }
        .wrap { max-width: 420px; }
        img { width: 72px; height: 72px; border-radius: 12px; margin-bottom: 20px; }
        h1 { font-size: 1.4rem; margin: 0 0 10px; }
        p { color: #9aa1a8; line-height: 1.6; margin: 0 0 24px; }
        button {
            background: #d81324;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #b30f1e; }
        .hint { margin-top: 18px; font-size: 0.8rem; color: #5c6167; }
    </style>
</head>
<body>
    <div class="wrap">
        <img src="/images/logo.png" alt="IMAGEN" />
        <h1>Estás sin conexión</h1>
        <p>Esta página todavía no se guardó para verse sin internet. Revisa tu conexión e intenta de nuevo — las páginas que ya visitaste antes sí deberían seguir disponibles.</p>
        <button onclick="location.reload()">Reintentar</button>
        <p class="hint"><a href="/" style="color:#9aa1a8;">Volver al inicio</a></p>
    </div>
</body>
</html>
