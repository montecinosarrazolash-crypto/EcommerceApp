<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión - IMAGEN</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b0d;
            color: #f4f5f7;
            font-family: 'Inter', system-ui, sans-serif;
            text-align: center;
            padding: 24px;
        }
        .box { max-width: 420px; }
        img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 20px; }
        h1 { font-size: 1.4rem; margin: 0 0 10px; }
        p { color: #9a9ea5; font-size: 0.95rem; line-height: 1.5; margin: 0 0 26px; }
        button {
            background: #d81324;
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }
        button:hover { background: #b90f1e; }
    </style>
</head>
<body>
    <div class="box">
        <img src="/images/icon-192.png" alt="IMAGEN" />
        <h1>Sin conexión a internet</h1>
        <p>No pudimos cargar esta página porque no hay conexión. Revisa tu internet e intenta de nuevo — lo que ya visitaste antes puede seguir disponible.</p>
        <button onclick="window.location.reload()">Reintentar</button>
    </div>
</body>
</html>
